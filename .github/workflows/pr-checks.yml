name: PR Code Quality Checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Lint and TypeScript Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Increase timeout
    env:
      HUSKY: 0 # Disable Husky in CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"
          cache: "npm"

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies with Node 20..."
          npm config set registry https://registry.npmjs.org/
          # Use npm ci for fast, reproducible installs
          npm ci --no-audit --no-fund

      - name: Run lint and TypeScript checks
        run: |
          echo "🔍 Running lint and TypeScript checks on changed files..."
          npm run lint:changed
          npm run tsc:changed
          echo "🎉 All checks passed!"
