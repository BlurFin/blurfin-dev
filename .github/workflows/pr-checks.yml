name: PR Code Quality Checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Lint and TypeScript Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Prevent infinite hanging
    env:
      HUSKY: 0 # Disable Husky in CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clean and prepare environment
        run: |
          echo "🧹 Cleaning npm cache and environment..."
          npm cache clean --force
          rm -rf node_modules apps/*/node_modules

      - name: Install root dependencies
        run: |
          echo "📦 Installing root dependencies only..."
          npm config set registry https://registry.npmjs.org/
          npm install --ignore-scripts --no-workspaces

      - name: Install workspace dependencies
        run: |
          echo "🏗️ Installing workspace dependencies..."
          # If npm install fails, try manual installation
          npm install --workspaces --ignore-scripts || {
            echo "⚠️ Falling back to manual workspace installation..."
            cd apps/web && npm install --ignore-scripts
            cd ../api && npm install --ignore-scripts || echo "API install skipped"
            cd ../..
          }

      - name: Run lint and TypeScript checks
        run: |
          echo "🔍 Running lint and TypeScript checks on changed files..."
          npm run lint:changed
          npm run tsc:changed
          echo "🎉 All checks passed!"
