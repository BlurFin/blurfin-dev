name: PR Code Quality Checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Lint and TypeScript Checks
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # Disable Husky in CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/*/package-lock.json

      - name: Install dependencies
        run: |
          # Skip Husky installation in CI environment
          npm ci --include-workspace-root --ignore-scripts

      - name: Run lint and TypeScript checks
        run: |
          echo "🔍 Running lint and TypeScript checks on changed files..."
          npm run lint:changed
          npm run tsc:changed
          echo "🎉 All checks passed!"
