name: PR Code Quality Checks

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Lint and TypeScript Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Prevent infinite hanging
    env:
      HUSKY: 0 # Disable Husky in CI

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clean and prepare environment
        run: |
          echo "🧹 Cleaning npm cache and environment..."
          npm cache clean --force
          rm -rf node_modules apps/*/node_modules

      - name: Install dependencies
        run: |
          echo "📦 Installing all dependencies..."
          npm config set registry https://registry.npmjs.org/
          # Use simple npm install without problematic flags
          npm install --ignore-scripts

      - name: Run lint and TypeScript checks
        run: |
          echo "🔍 Running lint and TypeScript checks on changed files..."
          npm run lint:changed
          npm run tsc:changed
          echo "🎉 All checks passed!"
