name: Develop Version Tracker

on:
  push:
    branches: [develop]

jobs:
  track-version:
    name: Debug Merged PRs
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug merged PRs
        run: |
          echo "🔍 Debug: Getting all PRs first..."
          gh api repos/${{ github.repository }}/pulls?state=all > /tmp/all_prs.json

          echo "🔍 Debug: Filtering merged PRs..."
          cat /tmp/all_prs.json | jq '.[] | select(.base.ref == "develop" and .state == "closed" and .merged_at != null) | "\(.title)|\(.number)"' > /tmp/merged_prs.txt

          echo "🔍 Debug: All PRs count:"
          cat /tmp/all_prs.json | jq 'length'

          echo "🔍 Debug: Closed PRs count:"
          cat /tmp/all_prs.json | jq '[.[] | select(.state == "closed")] | length'

          echo "🔍 Debug: Merged PRs count:"
          cat /tmp/all_prs.json | jq '[.[] | select(.merged_at != null)] | length'

          echo "🔍 Debug: Develop base PRs count:"
          cat /tmp/all_prs.json | jq '[.[] | select(.base.ref == "develop")] | length'

          echo "🔍 Debug: Develop base + closed PRs count:"
          cat /tmp/all_prs.json | jq '[.[] | select(.base.ref == "develop" and .state == "closed")] | length'

          echo "🔍 Debug: Develop base + closed + merged PRs count:"
          cat /tmp/all_prs.json | jq '[.[] | select(.base.ref == "develop" and .state == "closed" and .merged_at != null)] | length'

          if [ -s /tmp/merged_prs.txt ]; then
            echo "📋 Found merged PRs in file:"
            cat /tmp/merged_prs.txt
            echo "📋 Processing merged PRs..."
            
            # package.json에서 현재 버전 가져오기
            CURRENT_VERSION=$(cat package.json | jq -r '.version')
            echo "📦 Current version from package.json: $CURRENT_VERSION"
            
            # 버전 계산을 위한 변수 초기화
            MAJOR_COUNT=0
            MINOR_COUNT=0
            PATCH_COUNT=0
            
            while IFS='|' read -r pr_title pr_number; do
              if [[ -n "$pr_title" && -n "$pr_number" ]]; then
                # 따옴표 제거 및 정리
                CLEAN_TITLE=$(echo "$pr_title" | sed 's/^"//; s/"$//')
                CLEAN_NUMBER=$(echo "$pr_number" | sed 's/^"//; s/"$//')
                
                echo "✅ Found merged PR: $CLEAN_TITLE (#$CLEAN_NUMBER)"
                echo "🔗 PR Link: https://github.com/${{ github.repository }}/pull/$CLEAN_NUMBER"
                
                # PR 제목에서 버전 타입 분석 (정리된 제목 사용)
                if echo "$CLEAN_TITLE" | grep -qE "^major:"; then
                  MAJOR_COUNT=$((MAJOR_COUNT + 1))
                  echo "🔴 MAJOR version impact detected"
                elif echo "$CLEAN_TITLE" | grep -qE "^feat:"; then
                  MINOR_COUNT=$((MINOR_COUNT + 1))
                  echo "🟡 MINOR version impact detected"
                elif echo "$CLEAN_TITLE" | grep -qE "^fix:"; then
                  PATCH_COUNT=$((PATCH_COUNT + 1))
                  echo "🟢 PATCH version impact detected"
                elif echo "$CLEAN_TITLE" | grep -qE "^perf:"; then
                  PATCH_COUNT=$((PATCH_COUNT + 1))
                  echo "🟢 PATCH version impact detected"
                elif echo "$CLEAN_TITLE" | grep -qE "^(docs|style|test|chore):"; then
                  echo "⚪ NO version impact (docs/style/test/chore)"
                else
                  echo "❓ Unknown version impact (system merge or invalid format)"
                fi
              fi
            done < /tmp/merged_prs.txt
            
            # 버전 계산 결과 출력
            echo ""
            echo "📊 Version Impact Summary:"
            echo "🔴 Major changes: $MAJOR_COUNT"
            echo "🟡 Minor changes: $MINOR_COUNT"
            echo "🟢 Patch changes: $PATCH_COUNT"
            
            # 다음 버전 계산
            if [ $MAJOR_COUNT -gt 0 ]; then
              NEXT_VERSION_TYPE="MAJOR"
              # Major 버전 증가 (1.0.0 → 2.0.0)
              NEXT_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{print ($1+1)".0.0"}')
            elif [ $MINOR_COUNT -gt 0 ]; then
              NEXT_VERSION_TYPE="MINOR"
              # Minor 버전 증가 (0.0.0 → 0.1.0)
              NEXT_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{print $1"."($2+1)".0"}')
            elif [ $PATCH_COUNT -gt 0 ]; then
              NEXT_VERSION_TYPE="PATCH"
              # Patch 버전 증가 (0.0.0 → 0.0.1)
              NEXT_VERSION=$(echo "$CURRENT_VERSION" | awk -F. '{print $1"."$2"."($3+1)}')
            else
              NEXT_VERSION_TYPE="NONE"
              NEXT_VERSION="$CURRENT_VERSION"
            fi
            
            echo ""
            echo "🎯 Version Calculation Result:"
            echo "📦 Current version: $CURRENT_VERSION"
            echo "🚀 Next version: $NEXT_VERSION ($NEXT_VERSION_TYPE)"
            
            # develop → main PR 찾기
            DEVELOP_TO_MAIN_PR=$(gh api repos/${{ github.repository }}/pulls \
              --jq '.[] | select(.head.ref == "develop" and .base.ref == "main" and .state == "open") | .number' \
              | head -1)
            
            if [ -n "$DEVELOP_TO_MAIN_PR" ]; then
              echo "📋 Found develop → main PR: #$DEVELOP_TO_MAIN_PR"
              
              # 병합된 PR 리스트 생성 (오래된 것부터 상단에)
              MERGED_PR_LIST=""
              if [ -s /tmp/merged_prs.txt ]; then
                # 임시 파일에 버전 영향이 있는 PR들 저장
                echo "" > /tmp/version_prs.txt
                
                # 파일을 역순으로 읽어서 오래된 것부터 처리
                tac /tmp/merged_prs.txt | while IFS='|' read -r pr_title pr_number; do
                  if [[ -n "$pr_title" && -n "$pr_number" ]]; then
                    CLEAN_TITLE=$(echo "$pr_title" | sed 's/^"//; s/"$//')
                    CLEAN_NUMBER=$(echo "$pr_number" | sed 's/^"//; s/"$//')
                    
                    # 버전 영향이 있는 PR만 임시 파일에 추가 (대소문자 구분 없이)
                    if echo "$CLEAN_TITLE" | grep -qiE "^(major|feat|fix|perf|docs|style|test|chore|ci|build|refactor|revert)[:/]"; then
                      echo "- [$CLEAN_TITLE](https://github.com/${{ github.repository }}/pull/$CLEAN_NUMBER)" >> /tmp/version_prs.txt
                    fi
                  fi
                done
                
                # 임시 파일에서 내용을 읽어서 MERGED_PR_LIST 생성
                if [ -s /tmp/version_prs.txt ]; then
                  MERGED_PR_LIST=$(cat /tmp/version_prs.txt | sed 's/^/          /')
                fi
              fi
              
              # 댓글 내용을 파일로 생성
              echo "## 📦 Develop 브랜치 버전 상태" > /tmp/comment.txt
              echo "" >> /tmp/comment.txt
              echo "**현재 버전:** \`$CURRENT_VERSION\`" >> /tmp/comment.txt
              echo "**다음 릴리즈 버전:** \`$NEXT_VERSION\`" >> /tmp/comment.txt
              echo "" >> /tmp/comment.txt
              echo "### 🔄 병합된 작업들" >> /tmp/comment.txt
              echo "$MERGED_PR_LIST" >> /tmp/comment.txt
              
              COMMENT_BODY=$(cat /tmp/comment.txt)
              
              # 기존 댓글 삭제 (봇이 작성한 댓글 중에서)
              EXISTING_COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/$DEVELOP_TO_MAIN_PR/comments \
                --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("Develop 브랜치 버전 상태"))) | .id' \
                | head -1)
              
              if [ -n "$EXISTING_COMMENT_ID" ]; then
                echo "🗑️ Deleting existing comment #$EXISTING_COMMENT_ID"
                gh api repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT_ID \
                  --method DELETE
              fi
              
              # 새로운 댓글 생성
              echo "📝 Creating new version status comment"
              gh api repos/${{ github.repository }}/issues/$DEVELOP_TO_MAIN_PR/comments \
                --method POST \
                --field body="$COMMENT_BODY"
              
              echo "✅ Successfully updated version status on develop → main PR #$DEVELOP_TO_MAIN_PR"
            else
              echo "⚠️ No open develop → main PR found. Skipping comment creation."
            fi
          else
            echo "⚠️ No merged PRs found in file"
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
