name: Develop Version Tracker

on:
  pull_request:
    branches: [develop]
    types: [closed]

jobs:
  track-version:
    name: Track Merged PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Add develop summary comment
        run: |
          echo "📝 Adding develop branch summary..."

          # PR 정보 가져오기
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # PR의 커밋들 가져오기 (제목만)
          COMMITS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/commits --jq -r '.[].commit.message' | head -n 1)

          # 커밋 리스트 생성
          COMMIT_LIST=""
          while IFS= read -r commit; do
            if [[ -n "$commit" ]]; then
              COMMIT_LIST="$COMMIT_LIST- $commit"$'\n'
            fi
          done <<< "$COMMITS"

          # develop 브랜치에 댓글 추가 (마지막 커밋에)
          gh api repos/${{ github.repository }}/commits/${{ github.event.pull_request.merge_commit_sha }}/comments \
            --method POST \
            --field body="## 📦 Develop 브랜치 업데이트

          ### 🔄 병합된 작업: [$PR_TITLE](#$PR_NUMBER)

          <details>
          <summary><strong>📋 커밋 목록 보기</strong></summary>

          $COMMIT_LIST
          </details>"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
