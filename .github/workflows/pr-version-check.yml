name: Version Classification

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]

jobs:
  classify-version:
    name: Classify Version Impact
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Get PR commits and classify
        id: analyze
        run: |
          echo "🔍 Getting PR commits..."

          # PR 커밋들의 제목만 가져오기
          COMMIT_TITLES=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.number }}/commits --jq -r '.[].commit.message' | head -n 1)

          echo "📋 Commit titles:"
          echo "$COMMIT_TITLES"

          # 버전 변화 계산
          HAS_MAJOR=false
          HAS_MINOR=false
          HAS_PATCH=false

          while IFS= read -r commit; do
            if [[ -n "$commit" ]]; then
              if echo "$commit" | grep -qE "^major:"; then
                HAS_MAJOR=true
              elif echo "$commit" | grep -qE "^feat:"; then
                HAS_MINOR=true
              elif echo "$commit" | grep -qE "^fix:"; then
                HAS_PATCH=true
              fi
            fi
          done <<< "$COMMIT_TITLES"

          # 버전 변화 결정
          if [ "$HAS_MAJOR" = true ]; then
            VERSION_CHANGE="Major 버전 증가 (1.0.0)"
            VERSION_TYPE="major"
          elif [ "$HAS_MINOR" = true ]; then
            VERSION_CHANGE="Minor 버전 증가 (0.1.0)"
            VERSION_TYPE="minor"
          elif [ "$HAS_PATCH" = true ]; then
            VERSION_CHANGE="Patch 버전 증가 (0.0.1)"
            VERSION_TYPE="patch"
          else
            VERSION_CHANGE="버전 변화 없음"
            VERSION_TYPE="none"
          fi

          echo "📊 Version change: $VERSION_CHANGE"

          # 커밋 리스트 생성
          COMMIT_LIST=""
          while IFS= read -r commit; do
            if [[ -n "$commit" ]]; then
              COMMIT_LIST="$COMMIT_LIST- $commit"$'\n'
            fi
          done <<< "$COMMIT_TITLES"

          # PR에 댓글 추가
          gh pr comment ${{ github.event.number }} --body "## 📦 $VERSION_CHANGE

          ### 📋 커밋 목록
          $COMMIT_LIST"

          # Status check 설정
          if [ "$VERSION_TYPE" != "none" ] || [ "$HAS_PATCH" = true ] || [ "$HAS_MINOR" = true ] || [ "$HAS_MAJOR" = true ]; then
            STATUS="success"
            DESC="Version classified as $VERSION_TYPE"
          else
            # 커밋 형식 확인
            VALID=true
            while IFS= read -r commit; do
              if [[ -n "$commit" ]] && ! echo "$commit" | grep -qE "^(major|feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert):"; then
                VALID=false
                break
              fi
            done <<< "$COMMIT_TITLES"
            
            if [ "$VALID" = true ]; then
              STATUS="success"
              DESC="Valid commits, no version change"
            else
              STATUS="failure"
              DESC="Invalid commit format"
            fi
          fi

          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            --method POST \
            --field state="$STATUS" \
            --field target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --field description="$DESC" \
            --field context="version-classification"

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
