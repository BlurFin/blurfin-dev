name: Version Classification

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, edited]

jobs:
  classify-version:
    name: Classify Version Impact
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR commits
        id: commits
        run: |
          echo "Getting commits from PR..."
          # 각 커밋별로 첫 번째 줄만 추출
          COMMIT_TITLES=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.number }}/commits --jq -r '.[].commit.message' | while IFS= read -r message; do
            echo "$message" | head -n 1
          done)

          echo "Extracted commit titles:"
          echo "$COMMIT_TITLES"

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMIT_TITLES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify version impact
        id: classify
        run: |
          echo "🔍 Analyzing commit types for version impact..."

          COMMITS="${{ steps.commits.outputs.commits }}"

          # major 타입 수동 확인 (우선순위 높음)
          if echo "$COMMITS" | grep -qE "^major:" ; then
            RELEASE_TYPE="major"
            echo "🔴 Manual MAJOR version detected!"
          else
            # feat, fix, perf 등 Conventional Commits 타입 확인
            if echo "$COMMITS" | grep -qE "^feat:" ; then
              RELEASE_TYPE="minor"
            elif echo "$COMMITS" | grep -qE "^fix:" ; then
              RELEASE_TYPE="patch"
            elif echo "$COMMITS" | grep -qE "^perf:" ; then
              RELEASE_TYPE="patch"
            else
              RELEASE_TYPE="none" # docs, style, chore, test 등
            fi
          fi

          echo "📊 Final analysis result: $RELEASE_TYPE"

          # 커밋 메시지가 컨벤션을 따르는지 확인
          VALID_COMMITS=true

          # 각 커밋 제목이 conventional commits 형식인지 확인 (major 타입 추가)
          while IFS= read -r commit_title; do
            if [[ -n "$commit_title" ]]; then
              if ! echo "$commit_title" | grep -qE "^(major|feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?!?:" ; then
                echo "❌ Invalid commit format: $commit_title"
                VALID_COMMITS=false
              else
                echo "✅ Valid commit format: $commit_title"
              fi
            fi
          done <<< "$COMMITS"

          # 결과에 따른 분류
          case "$RELEASE_TYPE" in
            "major")
              echo "version_type=major" >> $GITHUB_OUTPUT
              echo "version_label=Major (Breaking Change)" >> $GITHUB_OUTPUT
              echo "✅ Version classified as: MAJOR"
              ;;
            "minor")
              echo "version_type=minor" >> $GITHUB_OUTPUT
              echo "version_label=Minor (New Feature)" >> $GITHUB_OUTPUT
              echo "✅ Version classified as: MINOR"
              ;;
            "patch")
              echo "version_type=patch" >> $GITHUB_OUTPUT
              echo "version_label=Patch (Bug Fix)" >> $GITHUB_OUTPUT
              echo "✅ Version classified as: PATCH"
              ;;
            *)
              # 커밋 컨벤션 준수 여부에 따라 처리
              if [ "$VALID_COMMITS" = "true" ]; then
                echo "version_type=none" >> $GITHUB_OUTPUT
                echo "version_label=No Version Impact (docs, style, test, etc.)" >> $GITHUB_OUTPUT
                echo "✅ Version classified as: NONE (non-functional changes)"
              else
                echo "version_type=invalid" >> $GITHUB_OUTPUT
                echo "version_label=Invalid Commit Format" >> $GITHUB_OUTPUT
                echo "❌ Invalid commit format detected"
                exit 1
              fi
              ;;
          esac

      - name: Calculate expected version after this PR
        id: expected_version
        run: |
          PR_TYPE="${{ steps.classify.outputs.version_type }}"

          echo "📊 This PR type: $PR_TYPE"

          # 현재 버전을 기준으로 이 PR이 병합되면 어떻게 될지 계산 (0.0.0 기준)
          major=0
          minor=0
          patch=0

          if [ "$PR_TYPE" = "major" ]; then
            major=$((major + 1))
            expected="${major}.${minor}.${patch}"
            change_desc="Major 버전 증가 (${expected})"
          elif [ "$PR_TYPE" = "minor" ]; then
            minor=$((minor + 1))
            expected="${major}.${minor}.${patch}"
            change_desc="Minor 버전 증가 (${expected})"
          elif [ "$PR_TYPE" = "patch" ]; then
            patch=$((patch + 1))
            expected="${major}.${minor}.${patch}"
            change_desc="Patch 버전 증가 (${expected})"
          else
            expected="0.0.0" # No change from initial 0.0.0
            change_desc="버전 변화 없음 (0.0.0)"
          fi

          echo "expected=$expected" >> $GITHUB_OUTPUT
          echo "change_desc=$change_desc" >> $GITHUB_OUTPUT
          echo "🚀 Expected version after merge: $expected"

      - name: Update PR with version info
        if: steps.classify.outputs.version_type != 'invalid'
        run: |
          echo "📝 Adding simple version info to PR..."

          # 커밋 리스트 생성
          COMMITS="${{ steps.commits.outputs.commits }}"
          echo "🔍 Debug - Commits received:"
          echo "$COMMITS"

          COMMIT_LIST=""
          if [[ -n "$COMMITS" ]]; then
            while IFS= read -r commit_title; do
              if [[ -n "$commit_title" ]]; then
                COMMIT_LIST="$COMMIT_LIST- $commit_title"$'\n'
                echo "✅ Added commit: $commit_title"
              fi
            done <<< "$COMMITS"
          else
            echo "❌ No commits found!"
            COMMIT_LIST="- (커밋 정보를 가져올 수 없습니다)"$'\n'
          fi

          gh pr comment ${{ github.event.number }} --body "## 📦 ${{ steps.expected_version.outputs.change_desc }}

          ### 📋 커밋 목록
          $COMMIT_LIST"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set commit status
        run: |
          if [ "${{ steps.classify.outputs.version_type }}" != "invalid" ]; then
            gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
              --method POST \
              --field state="success" \
              --field target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --field description="Version classified as ${{ steps.classify.outputs.version_type }}" \
              --field context="version-classification"
          else
            gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
              --method POST \
              --field state="failure" \
              --field target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --field description="Invalid commit format detected" \
              --field context="version-classification"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
